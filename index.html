<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I LOVE YOU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Cinzel:wght@400;700&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    cursor: none;
  }

  canvas { display: block; position: fixed; top: 0; left: 0; }

  #ui {
    position: fixed;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
    pointer-events: none;
  }

  #btn {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(13px, 2vw, 17px);
    letter-spacing: 0.35em;
    color: rgba(255,200,180,0.55);
    pointer-events: all;
    cursor: none;
    border: none;
    background: none;
    padding: 10px 24px;
    transition: color 0.4s, opacity 0.4s;
    opacity: 1;
    text-transform: lowercase;
    position: relative;
  }

  #btn::after {
    content: '';
    display: block;
    margin: 6px auto 0;
    width: 0;
    height: 1px;
    background: rgba(255,160,130,0.5);
    transition: width 0.4s;
  }
  #btn:hover::after { width: 80%; }
  #btn:hover { color: rgba(255,200,180,0.9); }

  #btn.hidden {
    opacity: 0;
    pointer-events: none;
  }

  #cursor {
    position: fixed;
    width: 8px;
    height: 8px;
    background: rgba(255,160,130,0.8);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, width 0.2s, height 0.2s;
    box-shadow: 0 0 12px rgba(255,120,100,0.6);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="cursor"></div>

<div id="ui">
  <button id="btn">нажми на меня</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const cursor = document.getElementById('cursor');
const btn = document.getElementById('btn');

let W = canvas.width = window.innerWidth;
let H = canvas.height = window.innerHeight;
let mouse = { x: W/2, y: H/2 };
let phase = 'text'; // 'text' | 'heart'
let animating = false;

// cursor
document.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  cursor.style.left = e.clientX + 'px';
  cursor.style.top = e.clientY + 'px';
});

// ── Particle ──────────────────────────────────────────────
class Particle {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.tx = 0; this.ty = 0;
    this.vx = 0; this.vy = 0;
    this.r = Math.random() * 1.6 + 0.4;
    this.baseR = this.r;
    this.alpha = Math.random() * 0.6 + 0.2;
    this.speed = Math.random() * 0.04 + 0.025;
    // warm rose palette
    const hues = [0, 8, 345, 20, 330];
    this.hue = hues[Math.floor(Math.random() * hues.length)];
    this.sat = 70 + Math.random() * 30;
    this.lit = 55 + Math.random() * 30;
  }

  update(repel) {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    this.vx += dx * this.speed;
    this.vy += dy * this.speed;
    this.vx *= 0.88;
    this.vy *= 0.88;
    this.x += this.vx;
    this.y += this.vy;

    // mouse repel
    if (repel) {
      const mx = mouse.x - this.x;
      const my = mouse.y - this.y;
      const d = Math.sqrt(mx*mx + my*my);
      if (d < 90) {
        const f = (90 - d) / 90;
        this.x -= mx * f * 0.08;
        this.y -= my * f * 0.08;
      }
    }
  }

  draw() {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const alpha = this.alpha * Math.max(0, 1 - dist / 250);
    const glow = this.r + (90 - Math.min(dist,90)) / 90 * 2;

    ctx.beginPath();
    ctx.arc(this.x, this.y, glow, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.lit}%,${alpha * 0.18})`;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},${this.sat}%,${this.lit}%,${alpha})`;
    ctx.fill();
  }
}

// ── Sample shapes ─────────────────────────────────────────
function sampleText(text, fontSize, density) {
  const offC = document.createElement('canvas');
  offC.width = W; offC.height = H;
  const offCtx = offC.getContext('2d');
  offCtx.fillStyle = '#fff';
  offCtx.font = `700 ${fontSize}px Cinzel`;
  offCtx.textAlign = 'center';
  offCtx.textBaseline = 'middle';
  offCtx.fillText(text, W/2, H/2);
  const data = offCtx.getImageData(0, 0, W, H).data;
  const pts = [];
  for (let y = 0; y < H; y += density) {
    for (let x = 0; x < W; x += density) {
      if (data[(y * W + x) * 4 + 3] > 128) pts.push({x, y});
    }
  }
  return pts;
}

function sampleHeart(density) {
  const pts = [];
  const cx = W/2, cy = H/2;
  const scale = Math.min(W, H) * 0.28;
  for (let t = 0; t < Math.PI*2; t += 0.001) {
    // heart parametric
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t));
    pts.push({ x: cx + hx/17 * scale, y: cy + hy/17 * scale });
  }
  // interior fill
  for (let y = cy - scale; y < cy + scale; y += density) {
    for (let x = cx - scale; x < cx + scale; x += density) {
      const nx = (x - cx) / scale * 8.5;
      const ny = (y - cy) / scale * 8.5;
      // heart formula
      const v = Math.pow(nx*nx + ny*ny - 1, 3) - nx*nx * ny*ny*ny;
      if (v <= 0) pts.push({x, y});
    }
  }
  return pts;
}

// ── Init ──────────────────────────────────────────────────
let particles = [];
let textPts = [];
let heartPts = [];
const TOTAL = 3200;

function buildParticles(pts) {
  const arr = [];
  const shuffled = pts.sort(() => Math.random()-0.5);
  for (let i = 0; i < TOTAL; i++) {
    const p = new Particle();
    const t = shuffled[i % shuffled.length];
    p.tx = t.x + (Math.random()-0.5)*2;
    p.ty = t.y + (Math.random()-0.5)*2;
    arr.push(p);
  }
  return arr;
}

function init() {
  const fs = Math.min(W * 0.18, 160);
  textPts = sampleText('I LOVE YOU', fs, 5);
  heartPts = sampleHeart(6);
  particles = buildParticles(textPts);
}

// ── Heart inner text ──────────────────────────────────────
let heartTextAlpha = 0;
let showHeartText = false;

function drawHeartText() {
  if (!showHeartText) return;
  ctx.save();
  ctx.globalAlpha = heartTextAlpha;
  const size1 = Math.min(W * 0.055, 42);
  const size2 = Math.min(W * 0.032, 24);
  ctx.font = `300 ${size1}px Cormorant Garamond`;
  ctx.fillStyle = 'rgba(255,220,200,1)';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(255,100,80,0.5)';
  ctx.shadowBlur = 20;
  ctx.fillText('люблю тебя', W/2, H/2 - size1*0.5);
  ctx.font = `300 ${size2}px Cormorant Garamond`;
  ctx.fillStyle = 'rgba(255,180,160,0.9)';
  ctx.fillText('и твоё тело', W/2, H/2 + size2*0.9);
  ctx.restore();
}

// ── Morph ─────────────────────────────────────────────────
function morphTo(newPts) {
  const shuffled = newPts.sort(() => Math.random()-0.5);
  particles.forEach((p, i) => {
    const t = shuffled[i % shuffled.length];
    p.tx = t.x + (Math.random()-0.5)*3;
    p.ty = t.y + (Math.random()-0.5)*3;
  });
}

btn.addEventListener('click', () => {
  if (animating) return;
  animating = true;
  phase = 'heart';
  btn.classList.add('hidden');
  morphTo(heartPts);
  showHeartText = true;
  let t = 0;
  const fadeIn = setInterval(() => {
    heartTextAlpha = Math.min(1, t / 90);
    t++;
    if (t > 90) clearInterval(fadeIn);
  }, 16);
});

// ── Loop ──────────────────────────────────────────────────
function loop() {
  ctx.clearRect(0, 0, W, H);

  // subtle bg glow
  if (phase === 'heart') {
    const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.min(W,H)*0.42);
    g.addColorStop(0, 'rgba(120,10,30,0.13)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  particles.forEach(p => {
    p.update(phase === 'text');
    p.draw();
  });

  drawHeartText();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  init();
  if (phase === 'heart') morphTo(heartPts);
});

init();
loop();
</script>
</body>
</html>
